<!DOCTYPE html>
<html lang="vi">

<head>

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary-bg: #ffffff;
            --text-main: #1a1a1a;
            --text-muted: #666666;
            --accent-color: #000000;
            --border-color: #000000;
        }

        * {
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #f0f0f0;
            color: var(--text-main);
            margin: 0;
            padding: 0;
        }

        .no-print-zone {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            gap: 10px;
        }

        #print-btn,
        #test-btn {
            background: #000;
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s;
        }

        #print-btn:hover,
        #test-btn:hover {
            transform: scale(1.05);
            background: #333;
        }

        #test-btn {
            background: #0066cc;
        }

        #test-btn:hover {
            background: #0052a3;
        }

        .page {
            width: 210mm;
            height: 297mm;
            padding: 15mm;
            margin: 10px auto;
            background: white;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            page-break-after: always;
        }

        @media print {
            body {
                background: white;
            }

            .no-print-zone {
                display: none !important;
            }

            .page {
                margin: 0;
                box-shadow: none;
                width: 210mm;
                height: 297mm;
            }
        }

        .header-info {
            text-align: center;
            margin-bottom: 15px;
            font-size: 14px;
            font-weight: 600;
            border-bottom: 2px solid #000;
            padding-bottom: 8px;
        }

        .header-info .date {
            font-weight: 400;
            color: #555;
        }

        .dual-table-container {
            display: flex;
            justify-content: space-between;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        th,
        td {
            border: 1px solid var(--border-color);
            padding: 5px;
            vertical-align: middle;
            height: 48px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        th {
            background-color: #f2f2f2;
            font-size: 13px;
            height: 40px;
        }

        .col-stt {
            width: 45px;
            text-align: center;
        }

        .col-ten {
            text-align: left;
            font-weight: 500;
            font-size: 14px;
            padding-left: 10px;
        }

        .col-sl {
            width: 60px;
            text-align: center;
            font-weight: 700;
            font-size: 18px;
        }

        .spacer {
            border: none !important;
            width: 60px;
        }

        .empty-state {
            text-align: center;
            margin-top: 100px;
            color: #999;
            font-size: 18px;
        }

        .error-state {
            text-align: center;
            margin-top: 80px;
            color: #cc0000;
            font-size: 16px;
            padding: 20px;
            background: #fff0f0;
            border-radius: 8px;
            max-width: 80%;
            margin-left: auto;
            margin-right: auto;
        }

        .error-state pre {
            text-align: left;
            background: #f8f8f8;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
            font-size: 12px;
            max-height: 200px;
        }

        .total-count {
            text-align: right;
            font-size: 13px;
            font-weight: 600;
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px solid #ddd;
        }

        @media print {
            .total-count {
                position: absolute;
                bottom: 15mm;
                right: 15mm;
            }
        }
    </style>
</head>

    <div class="no-print-zone">

    <div id="main-content">
        <!-- JS sẽ chèn các trang vào đây -->
    </div>

    <script>
        // Hàm parse dữ liệu từ URL - CẢI TIẾN
        function parseDataFromURL() {
            const urlParams = new URLSearchParams(window.location.search);
            let date = '';
            let items = [];

            // Lấy tất cả các tham số
            const allParams = {};
            for (const [key, value] of urlParams.entries()) {
                allParams[key] = value;
            }

            // Tham số 'data' có thể chứa cả date và danh sách hoa
            if (allParams.data) {
                const dataValue = allParams.data;
                // Tách date và danh sách hoa (ngăn cách bởi '&')
                const parts = dataValue.split('&');
                if (parts.length >= 2) {
                    date = parts[0].trim();
                    // Phần còn lại là danh sách hoa
                    const flowerPart = parts.slice(1).join('&');
                    items = parseFlowerList(flowerPart);
                } else {
                    // Nếu không có '&', thử parse trực tiếp
                    const match = dataValue.match(/^([^&]+)&(.+)$/);
                    if (match) {
                        date = match[1].trim();
                        items = parseFlowerList(match[2]);
                    } else {
                        // Thử xem có phải toàn bộ là danh sách hoa không
                        items = parseFlowerList(dataValue);
                    }
                }
            }

            // Nếu không có tham số 'data', thử lấy từ các tham số khác
            if (items.length === 0) {
                // Kiểm tra tham số đầu tiên có phải là ngày không
                const firstKey = Object.keys(allParams)[0];
                if (firstKey && !firstKey.includes('data')) {
                    date = firstKey;
                    const flowerValue = allParams[firstKey];
                    if (flowerValue) {
                        items = parseFlowerList(flowerValue);
                    }
                }
            }

            return { date, items };
        }

        // Hàm parse danh sách hoa - CẢI TIẾN
        function parseFlowerList(str) {
            if (!str) return [];

            // Giải mã URL encoding
            let decoded = str;
            try {
                decoded = decodeURIComponent(str);
            } catch (e) {
                // Nếu không decode được, giữ nguyên
            }

            // Loại bỏ khoảng trắng thừa và các ký tự lạ
            let clean = decoded
                .replace(/\s*,\s*/g, ',') // Xóa khoảng trắng quanh dấu phẩy
                .replace(/\s*\|\s*/g, '|') // Xóa khoảng trắng quanh dấu |
                .replace(/\s+/g, ' ') // Chuẩn hóa khoảng trắng
                .trim();

            // Nếu chuỗi bắt đầu bằng '?', loại bỏ
            if (clean.startsWith('?')) {
                clean = clean.substring(1);
            }

            // Tách các item
            const items = [];
            const parts = clean.split(',');

            for (const part of parts) {
                if (!part.trim()) continue;

                // Tìm dấu | cuối cùng để tách tên và số lượng
                const lastPipeIndex = part.lastIndexOf('|');
                let name = part;
                let qty = '0';

                if (lastPipeIndex !== -1) {
                    name = part.substring(0, lastPipeIndex).trim();
                    qty = part.substring(lastPipeIndex + 1).trim();
                }

                // Nếu name chứa '|', giữ nguyên (trường hợp có nhiều dấu |)
                if (name.includes('|')) {
                    // Lấy phần sau dấu | cuối cùng làm số lượng
                    const parts2 = name.split('|');
                    name = parts2.slice(0, -1).join('|').trim();
                    qty = parts2[parts2.length - 1].trim();
                }

                // Làm sạch số lượng
                const cleanQty = qty.replace(/[^0-9.]/g, '');
                const qtyNumber = parseFloat(cleanQty) || 0;

                if (name && name.length > 0) {
                    items.push({
                        name: name,
                        qty: cleanQty || '0',
                        qtyNumber: qtyNumber
                    });
                }
            }

            return items;
        }

        // Hàm render dữ liệu
        function renderData(date, items) {
            const mainContent = document.getElementById('main-content');
            mainContent.innerHTML = '';

            // Sắp xếp giảm dần theo số lượng
            items.sort((a, b) => b.qtyNumber - a.qtyNumber);

            // Lọc bỏ item có số lượng = 0 (tùy chọn)
            const filteredItems = items.filter(item => item.qtyNumber > 0);

            if (filteredItems.length === 0) {
                mainContent.innerHTML = `
                    <div class="page">
                        <div class="empty-state">
                            <p>📋 Không có dữ liệu hoa</p>
                            <p style="font-size:14px;color:#aaa;margin-top:10px;">
                                ${items.length > 0 ? 'Tất cả hoa đều có số lượng = 0' : 'Vui lòng kiểm tra lại URL'}
                            </p>
                        </div>
                    </div>
                `;
                return;
            }

            const ROWS_PER_PAGE = 20;
            const ITEMS_PER_PAGE = ROWS_PER_PAGE * 2;
            const totalPages = Math.ceil(filteredItems.length / ITEMS_PER_PAGE);

            for (let pageIndex = 0; pageIndex < totalPages; pageIndex++) {
                const start = pageIndex * ITEMS_PER_PAGE;
                const pageItems = filteredItems.slice(start, start + ITEMS_PER_PAGE);
                const leftColItems = pageItems.slice(0, ROWS_PER_PAGE);
                const rightColItems = pageItems.slice(ROWS_PER_PAGE, ITEMS_PER_PAGE);

                const pageDiv = document.createElement('div');
                pageDiv.className = 'page';

                let rowsHtml = '';
                for (let r = 0; r < ROWS_PER_PAGE; r++) {
                    const left = leftColItems[r];
                    const right = rightColItems[r];

                    // STT toàn cục
                    const leftStt = left ? start + r + 1 : '';
                    const rightStt = right ? start + ROWS_PER_PAGE + r + 1 : '';

                    const leftCell = left ?
                        `<td class="col-stt">${leftStt}</td><td class="col-ten">${left.name}</td><td class="col-sl">${left.qty}</td>` :
                        `<td class="col-stt"></td><td class="col-ten"></td><td class="col-sl"></td>`;

                    const rightCell = right ?
                        `<td class="col-stt">${rightStt}</td><td class="col-ten">${right.name}</td><td class="col-sl">${right.qty}</td>` :
                        `<td class="col-stt"></td><td class="col-ten"></td><td class="col-sl"></td>`;

                    rowsHtml += `<tr>${leftCell}<td class="spacer"></td>${rightCell}</tr>`;
                }

                // Hiển thị ngày trên mỗi trang
                const dateDisplay = date ? ` - Ngày: ${date}` : '';

                pageDiv.innerHTML = `
                    <div class="header-info">
                        DANH SÁCH HOA TRONG NGÀY${dateDisplay}
                    </div>
                    <div class="dual-table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th class="col-stt">STT</th><th class="col-ten">TÊN HOA</th><th class="col-sl">SL</th>
                                    <th class="spacer"></th>
                                    <th class="col-stt">STT</th><th class="col-ten">TÊN HOA</th><th class="col-sl">SL</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${rowsHtml}
                            </tbody>
                        </table>
                    </div>
                    <div class="total-count">
                        Tổng: ${filteredItems.length} loại hoa | Trang ${pageIndex + 1}/${totalPages}
                    </div>
                `;
                mainContent.appendChild(pageDiv);
            }
        }

        // Hàm chính - parse và render
        function parseAndRender() {
            try {
                const { date, items } = parseDataFromURL();

                // Nếu không có dữ liệu, thử lấy từ các tham số khác (fallback)
                if (items.length === 0) {
                    const urlParams = new URLSearchParams(window.location.search);
                    // Thử lấy tất cả các tham số và ghép lại
                    let allData = '';
                    for (const [key, value] of urlParams.entries()) {
                        if (key === 'data') continue;
                        allData += key + '=' + value + '&';
                    }
                    if (allData) {
                        allData = allData.slice(0, -1);
                        const decoded = decodeURIComponent(allData);
                        const parts = decoded.split('&');
                        if (parts.length >= 2) {
                            const flowerPart = parts.slice(1).join('&');
                            const parsedItems = parseFlowerList(flowerPart);
                            if (parsedItems.length > 0) {
                                renderData(parts[0], parsedItems);
                                return;
                            }
                        }
                    }
                }

                renderData(date, items);

            } catch (e) {
                console.error('Lỗi:', e);
                document.getElementById('main-content').innerHTML = `
                    <div class="page">
                        <div class="error-state">
                            <h3>⚠️ Lỗi xử lý dữ liệu</h3>
                            <p>${e.message}</p>
                            <pre>${e.stack}</pre>
                        </div>
                    </div>
                `;
            }
        }

            // Tạo URL với dữ liệu mẫu
            const date = new Date().toLocaleDateString('vi-VN');
            const flowerStr = sampleFlowers.map(([name, qty]) => `${name}|${qty}`).join(',');
            const encodedFlowers = encodeURIComponent(flowerStr);
            const newUrl = window.location.pathname + '?data=' + encodeURIComponent(date) + '&' + encodedFlowers;

            // Cập nhật URL và reload
            window.history.replaceState(null, '', newUrl);
            parseAndRender();
        }

        // Tự động chạy khi load trang
        window.addEventListener('DOMContentLoaded', parseAndRender);
    </script>
</body>

</html>
